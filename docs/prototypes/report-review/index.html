<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#242638;background:#f7f7fb;--accent:#5148ca;--muted:#676b7d;--line:#e2e3ed;--tint:#efedff}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button,a,select,summary{min-height:44px}button{border:1px solid var(--line);border-radius:9px;padding:10px 15px;background:#fff;color:inherit;cursor:pointer;font-weight:600}button:hover{border-color:#9b94de;background:#f6f5ff}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #8579e4;outline-offset:3px}button.primary{background:var(--accent);color:#fff;border-color:transparent}a{color:var(--accent);text-underline-offset:4px;display:inline-flex;align-items:center}p{line-height:1.7;margin:8px 0}h1{font-size:30px;letter-spacing:-1px;margin:0 0 10px}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}small,.muted{color:var(--muted);line-height:1.7}.shell{display:grid;grid-template-columns:195px minmax(0,1fr);min-height:100vh;max-width:1600px;margin:auto}.sidebar{background:#fff;border-right:1px solid var(--line);padding:30px 20px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:750;margin-bottom:35px}.mark{background:var(--accent);color:white;padding:7px 10px;border-radius:10px}.sidebar nav{display:grid;gap:10px}.sidebar nav span{padding:13px 14px;border-radius:9px;color:#4d5163}.sidebar nav .selected{background:var(--tint);color:var(--accent);font-weight:700}main{min-width:0;padding:28px 40px 120px}.prototype-note{background:#fff7df;border:1px solid #ecdfb4;color:#735b20;border-radius:9px;padding:10px 14px;font-size:13px;margin-bottom:22px}.steps{font-size:13px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap;margin-bottom:22px}.steps strong{color:var(--accent)}.titlebar,.row,.tools{display:flex;gap:12px;align-items:center;justify-content:space-between}.tools{justify-content:flex-start;flex-wrap:wrap}.titlebar{align-items:flex-start;margin-bottom:24px}.titlebar p{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:24px;margin-bottom:18px}.overview{display:grid;grid-template-columns:180px 1fr;gap:28px}.score{color:#322c8a;font-size:48px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}.overview .score small{font-size:16px;color:var(--muted);font-weight:400}.summary{border-left:1px solid var(--line);padding-left:28px}.tag{display:inline-block;padding:3px 9px;border-radius:20px;background:#f0eff9;color:#514c7b;font-size:12px}.tag.default{background:#fff5dd;color:#7b5a13}.tag.warning{background:#fff0eb;color:#a14124}.callout{background:#f5f3ff;border-left:3px solid #8d80df;padding:12px 15px;line-height:1.7;margin:16px 0}.callout.warn{background:#fff7e8;border-color:#c59234;color:#7d591b}.score-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}.dimension-nav{display:grid;gap:8px}.dimension{width:100%;text-align:left;padding:15px;border:1px solid var(--line);border-radius:10px;background:#fff}.dimension[aria-pressed=true]{border-color:#9185df;background:#f4f2ff;box-shadow:inset 3px 0 var(--accent)}.dimension .name{font-size:15px;line-height:1.5;flex:1;min-width:0}.dimension .value{font-size:20px;color:#34314d;white-space:nowrap}.dimension small{font-weight:400;font-size:12px}.dimension progress{display:block;width:100%;height:5px;margin:12px 0 8px;accent-color:#7261da}.dimension.default progress{accent-color:#b99954}.detail{min-width:0}.detail-header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:16px}.detail-header .score{font-size:30px}.detail-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:20px}.detail-tabs button{border:0;background:transparent;border-radius:0;color:var(--muted);padding:10px 2px}.detail-tabs button[aria-selected=true]{color:var(--accent);border-bottom:2px solid var(--accent)}.point{padding:16px 0;border-top:1px solid var(--line)}.point:first-of-type{border-top:0}.point h3{display:flex;gap:10px;align-items:baseline}.point .indicator{color:#5d6d56;font-size:12px;white-space:nowrap}.point.gap .indicator{color:#a16e27}.evidence{background:#f8f8fc;border:1px solid #e9e9f0;border-radius:8px;padding:12px 14px;margin-top:12px}.evidence blockquote{margin:7px 0;line-height:1.75;color:#47495a}.evidence button{color:var(--accent);font-size:13px;background:transparent;border:0;padding:6px 0}.section-label{font-size:13px;color:var(--muted);margin:20px 0 10px}.empty{padding:24px 0}.criteria{width:100%;border-collapse:collapse;font-size:14px}.criteria td,.criteria th{padding:14px 10px;border-bottom:1px solid var(--line);text-align:left;line-height:1.7}.criteria th{color:var(--muted);font-weight:500}.band{display:grid;grid-template-columns:70px 1fr;gap:12px;border-bottom:1px solid var(--line);padding:12px 0;font-size:14px;line-height:1.7}.detail-footer{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.accordion-row{margin-bottom:12px}.accordion-row>.dimension{border-radius:10px}.accordion-row>.panel{margin:0;border-top:0;border-radius:0 0 12px 12px}.accordion-row.expanded>.dimension{border-radius:10px 10px 0 0}.score-table{width:100%;border-collapse:collapse}.score-table td,.score-table th{padding:16px 12px;border-bottom:1px solid var(--line);text-align:left}.score-table th{color:var(--muted);font-weight:500;font-size:13px}.score-table .table-number{font-size:22px;font-weight:700}.prototype-controls{margin-top:28px;padding:18px;border:1px dashed #c7c5d6;border-radius:10px;display:flex;gap:15px;align-items:center;flex-wrap:wrap;font-size:13px}.prototype-controls select{border:1px solid var(--line);background:white;border-radius:8px;padding:8px;max-width:100%}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#262342;color:white;border-radius:14px;padding:5px 8px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 18px #15112c25;z-index:5;max-width:calc(100vw - 24px);font-size:13px}.switcher button{color:white;background:transparent;border:0;min-width:44px}.switcher span{white-space:nowrap}.toast{position:fixed;top:20px;right:24px;max-width:calc(100vw - 48px);padding:14px 20px;background:#252140;color:white;border-radius:10px;z-index:20}.toast:empty{display:none}dialog{border:0;border-radius:15px;padding:26px;width:min(760px,calc(100vw - 32px));max-height:88vh;overflow:auto;color:inherit;box-shadow:0 15px 70px #17132b38}dialog::backdrop{background:#17132b65}dialog.drawer{position:fixed;inset:0 0 0 auto;margin:0;width:min(720px,100vw);height:100vh;max-height:100vh;border-radius:0;padding:28px}.dialog-actions{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}.answer-text{white-space:pre-wrap;line-height:1.9;background:#f8f8fc;border-radius:9px;padding:20px}.back{font-weight:400}.state-line{font-size:12px;color:var(--muted);margin:14px 0}.mobile-help{font-size:13px;margin-top:12px;color:var(--muted)}
@media(min-width:1200px){main{padding-inline:50px}}@media(max-width:1000px){.shell{grid-template-columns:155px 1fr}main{padding:24px}.score-grid{grid-template-columns:245px 1fr}.sidebar{padding:24px 12px}.panel{padding:20px}}@media(max-width:820px){.shell{display:block}.sidebar{padding:14px 18px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin-bottom:10px;font-size:17px}.sidebar nav{display:flex;flex-wrap:wrap;gap:2px}.sidebar nav span{font-size:12px;padding:8px 10px}.score-grid{grid-template-columns:1fr}.dimension-nav{grid-template-columns:repeat(2,minmax(0,1fr))}.dimension{padding:12px}.dimension .value{font-size:18px}.overview{grid-template-columns:130px 1fr;gap:16px}.summary{padding-left:18px}.titlebar{flex-wrap:wrap}.score-table th,.score-table td{padding:12px 6px}.score-table td small{display:block}.score-table .weight{display:none}main{padding:20px 16px 110px}}@media(max-width:440px){h1{font-size:26px}.overview{grid-template-columns:1fr}.summary{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.score{font-size:42px}.panel{padding:18px}.dimension-nav{gap:8px}.dimension .row{align-items:flex-start;gap:5px}.dimension .name{font-size:13px}.dimension .value{font-size:17px}.detail-header .row{align-items:flex-start}.titlebar .tools{width:100%}.titlebar .tools button{flex:1}.steps{gap:10px;font-size:12px}.criteria td,.criteria th{padding:12px 5px}.criteria td:first-child{width:29%}.score-table .table-number{font-size:18px}.score-table button{padding:8px;font-size:12px}.prototype-controls{display:grid;gap:10px}.point h3{align-items:flex-start}.detail-footer button{width:100%}}
</style></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><img src="logo.png" alt="好好面，好好准备，好好面试" style="width:100%;height:auto;max-height:80px;object-fit:contain"></div><nav aria-label="工作台位置"><span>模拟面试</span><span class="selected">面试记录</span><span>录音复盘</span><span>简历库</span><span>模型设置</span></nav></aside><main id="main"></main></div><div class="switcher" aria-label="原型方案比较"><button data-layout="prev" aria-label="上一种布局">←</button><span id="variant-label"></span><button data-layout="next" aria-label="下一种布局">→</button></div><dialog id="detail-dialog" class="drawer" aria-label="维度分析"><div id="drawer-content"></div></dialog><dialog id="answer-dialog" aria-label="回答原文"><div id="answer-content"></div></dialog><dialog id="return-dialog" aria-label="返回作答预览"><h2>返回作答修改</h2><p id="return-description"></p><div class="callout">这里演示跳转出口。正式接入后会回到作答页，修改后报告标记为待重新评估；报告页本身不提供重答、参考答案或草稿编辑。</div><div class="dialog-actions"><button data-close="return-dialog">返回报告原型</button></div></dialog><p id="toast" class="toast" role="status"></p>
<script>
// Throwaway report-page prototype. Only in-memory sample data; no APIs or storage.
const weights=[23,27,17,13,13,7];
const names=['岗位匹配度','专业能力／技术深度','逻辑思维与问题解决','沟通协作与推动力','学习成长潜力','价值观与文化契合'];
const answers=[
 {id:'a1',question:'介绍一次你负责的产品项目。',text:'我负责将人工巡检需求整理为产品方案，访谈了一线班组和业务负责人，拆分了巡检派单、现场上报和异常闭环三个环节。上线后，交付周期从120天缩短到90天。'},
 {id:'a2',question:'为什么采用这个技术方案？如何验证效果？',text:'我们把知识库和大模型接在一起，用户可以直接提问。我主要负责需求和验收，技术方案由研发确定。上线后大家反馈效果不错，我们还没有建立独立的评测集。'},
 {id:'a3',question:'出现方案分歧时，你如何推进？',text:'业务方希望先覆盖所有场景，研发认为时间不够。我召集双方确认首版范围，先完成三个高频场景，其余需求排入下一期。双方后来接受了这个安排。'},
 {id:'a4',question:'你如何定位并解决项目问题？',text:'我们发现问题集中在异常上报环节。我先按班组和设备类型整理反馈，再将问题拆为操作路径、信息缺失和系统响应三类，优先修复高频问题。暂时没有记录不同问题对整体效率的影响。'},
 {id:'a5',question:'你如何根据反馈学习和迭代？',text:'第一次验收暴露出我对一线操作不了解。我重新跟班观察，补画了现场操作路径，并把现场走查纳入后续每个版本的验收。后续两个版本没有再出现同类遗漏。'},
 {id:'a6',question:'遇到交付风险时如何处理承诺？',text:'发现交付有延期风险后，我先向业务方说明当前问题和可交付范围，没有把未完成部分说成已经做好。双方确认了分阶段验收清单，我每周同步风险进展。'}
];
const rows=[
 {scope:'结合目标岗位中需求分析、产品规划和落地验证的要求，审查第1、2、4题。',reason:'回答体现了需求拆解与业务落地经历，能够对应产品经理的主要职责；但收益指标的统计口径与个人决策贡献仍未说明充分，因此尚不足以进入高分档。',strength:['需求分析能够落到业务流程','把访谈结果拆成具体产品环节，展示了业务理解与需求结构化能力。',0,'拆分了巡检派单、现场上报和异常闭环三个环节。'],gap:['项目收益缺少可核对的统计口径','虽然给出了周期变化，但未解释统计样本、对比条件及本人决策如何造成这一变化；因此还不能确认收益与岗位贡献之间的完整联系。',0,'上线后，交付周期从120天缩短到90天。'],criteria:[['职责对应','经历是否对应 JD 的核心职责，而非只重复岗位关键词。'],['个人贡献','能否区分本人行动、团队行动和最终结果。'],['结果验证','收益是否有清楚的口径、对照和因果边界。']]},
 {scope:'重点审查第2题中技术机制、方案选择与评估方法的说明。',reason:'候选人给出了“知识库＋大模型”的方向，但没有解释检索、上下文组织、评估或备选方案取舍；且明确尚无独立评测集，专业深度的证据较薄弱。此分反映回答展示不足，不代表未做过相关工作。',strength:['能够说明自身职责边界','明确区分了产品侧需求验收与研发技术决策，没有把团队技术工作笼统归为自己的贡献。',1,'我主要负责需求和验收，技术方案由研发确定。'],gap:['关键技术和效果验证未展开','没有说明为何选此方案、如何判断回答质量及如何处理失败场景；“反馈不错”不足以支持专业效果结论。',1,'上线后大家反馈效果不错，我们还没有建立独立的评测集。'],criteria:[['机制理解','能否解释关键工具和方法如何工作、适用边界是什么。'],['方案取舍','是否说明约束、替代方案及选择依据。'],['评估能力','是否给出评测方法、错误类型、指标与风险处理。']]},
 {scope:'结合第1、4题，审查问题拆解、定位和验证是否形成闭环。',reason:'能够按对象和问题类型进行拆解，也说明了优先处理高频问题；但尚缺少根因验证和方案效果的量化依据，属于具备基本结构、关键验证不足。',strength:['问题拆分有明确维度','先按班组和设备整理，再区分问题类型，为定位与分工提供了结构。',3,'再将问题拆为操作路径、信息缺失和系统响应三类'],gap:['优先级与结果验证未闭环','选择高频问题有一定依据，但没有说明频次之外的影响评估和修复后的对比，因此难判断是否解决了核心瓶颈。',3,'暂时没有记录不同问题对整体效率的影响。'],criteria:[['问题定义','是否界定目标、现象与真正待解决的问题。'],['拆解与定位','拆解依据、假设和验证能否支持根因判断。'],['验证闭环','是否比较方案效果，并解释仍存在的限制。']]},
 {scope:'审查第3题中利益相关方、分歧处理、实际推动与结果。',reason:'有具体分歧和组织对齐的行动，也形成了范围共识；但没有说明各方判断标准、说服依据和执行后的验证，推动力证据尚不完整。',strength:['推动分歧转为可执行范围','通过共同确认首版范围，把抽象争论转化为可分期交付的方案。',2,'我召集双方确认首版范围，先完成三个高频场景'],gap:['缺少达成共识的关键过程','没有展开为什么是这三个场景、如何说服双方，以及达成共识后如何确保执行；因此无法判断推动方法的可复用性。',2,'双方后来接受了这个安排。'],criteria:[['角色理解','能否识别相关方目标与具体冲突。'],['推动行动','是否有明确的对齐、决策与推进动作。'],['执行结果','共识是否落实，个人贡献与结果是否清楚。']]},
 {scope:'审查第5题中反馈吸收、行为改变和后续验证。',reason:'回答呈现了从验收问题到现场学习、流程调整再到后续版本验证的过程；不过对新方法的适用范围和持续追踪还可更清晰。',strength:['把反馈转化为后续工作机制','不仅补充知识，还将现场观察固定为后续验收步骤。',4,'并把现场走查纳入后续每个版本的验收。'],gap:['验证样本和适用边界仍有限','两个版本未重复问题提供了初步支持，但没有说明是否还覆盖不同场景和长期效果。',4,'后续两个版本没有再出现同类遗漏。'],criteria:[['主动学习','学习行为是否围绕明确的问题或能力缺口。'],['反思迁移','是否改变具体做法，而非只表达学习意愿。'],['后续验证','改变是否被验证，是否说明适用边界。']]},
 {scope:'只评价第6题中风险沟通、承诺和协作行为；未提供具体企业文化材料，不作企业文化匹配结论。',reason:'回答体现了如实沟通风险、界定承诺和持续同步的行为；但未涉及更复杂利益冲突下的取舍，评价范围限定于该事件中的表现。',strength:['风险出现后主动澄清交付边界','明确说明未完成部分并推动分阶段确认，体现了责任与合作行为。',5,'没有把未完成部分说成已经做好。'],gap:['高压力取舍的过程未充分展开','说明了风险同步，但未说明如果对方不同意分期交付，将怎样处理承诺与业务压力。',5,'双方确认了分阶段验收清单'],criteria:[['责任与坦诚','是否如实说明事实、风险和本人责任。'],['承诺处理','面对压力时如何处理承诺、边界与取舍。'],['合作方式','是否尊重相关方并保持可核对的沟通；不推断人格。']]}
];
const baseScores=[70,42,60,58,68,72];const labels={A:'左右分栏（推荐）',B:'逐项展开',C:'列表＋详情抽屉'};let variant=['A','B','C'].includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A';let selected=0;let tab='analysis';let scenario='missing';let retrying=false;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(i){if(scenario==='failed'&&i===1)return'failed';if(scenario!=='complete'&&i>=4)return'default';return'evaluated'}
function score(i){return status(i)==='failed'?null:status(i)==='default'?60:baseScores[i]}
function badge(i){return status(i)==='failed'?'<span class="tag warning">分析失败 · 非0分</span>':status(i)==='default'?'<span class="tag default">默认分 · 非实际评估</span>':'<span class="tag">有作答依据 · AI分析示例</span>'}
function number(i){return score(i)===null?'—':score(i)+'<small> 分</small>'}
function dimension(i){return `<button class="dimension ${status(i)}" data-dimension="${i}" aria-pressed="${selected===i}" aria-label="${names[i]}，${score(i)===null?'分析失败':score(i)+'分'}"><span class="row"><span class="name">${names[i]}</span><span class="value">${number(i)}</span></span><progress max="100" value="${score(i)||0}" aria-label="${names[i]}分数"></progress><small>权重 ${weights[i]}% · ${status(i)==='default'?'用户确认未补答':status(i)==='failed'?'待重新分析':'查看评分理由与回答分析'}</small></button>`}
function point(type,data){const[title,analysis,index,quote]=data;return `<div class="point ${type==='不足'?'gap':''}"><h3><span class="indicator">${type}</span>${title}</h3><p>${analysis}</p><div class="evidence"><small>依据 · 第${index+1}题 · 本次报告答案快照</small><blockquote>“${esc(quote)}”</blockquote><button data-answer="${index}">查看完整回答 ↗</button></div></div>`}
function rubric(i){return `<h3>这个维度考察什么</h3><table class="criteria"><thead><tr><th>考察点</th><th>判断标准</th></tr></thead><tbody>${rows[i].criteria.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td></tr>`).join('')}</tbody></table><h3 style="margin-top:24px">评分档位</h3>${[['90–100','机制、取舍、行动与验证充分，有实质证据并能说明边界。'],['75–89','核心能力较扎实，部分验证细节或边界尚可补充。'],['60–74','有相关经历或方法，关键解释、个人贡献或验证存在缺口。'],['40–59','已有可评价回答，但核心解释薄弱或有具体错误。'],['0–39','已有回答中存在严重且有依据的核心错误；不因缺少引文或接口失败记0分。']].map(x=>`<div class="band"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}<div class="callout warn">未覆盖且用户确认不补答：按默认 60 分计入。无法完成分析或引文核对失败：显示待核查，不计算有效总分。</div><small>这里展示固定标准；具体得分依据请查看「回答分析」。不逐题打分。</small>`}
function detail(i,inDrawer=false){const state=status(i);return `<div class="detail-header"><div class="row"><div><small>整场评分维度 · 权重 ${weights[i]}%</small><h2 style="margin-top:6px">${names[i]}</h2>${badge(i)}</div><strong class="score">${number(i)}</strong></div></div><div class="detail-tabs" role="tablist" aria-label="${names[i]}详情"><button role="tab" data-tab="analysis" aria-selected="${tab==='analysis'}">回答分析</button><button role="tab" data-tab="rubric" aria-selected="${tab==='rubric'}">评分细则</button></div><div role="tabpanel">${tab==='rubric'?rubric(i):state==='default'?`<div class="empty"><h3>本维度未补答，按默认分计入</h3><p>评分前检查中，用户选择不补答此维度，因此采用约定的 60 分。</p><div class="callout warn">这不是模型对实际能力的判断。没有对应回答，不生成虚构的亮点、不足或引文。</div><p class="muted">如需实际评估，请返回作答补充相关经历，再手动重新评估整场。</p></div>`:state==='failed'?`<div class="empty"><h3>分析未完成，暂不展示分数</h3><p>本维度暂未获得可核对的分析，不能解释成候选人得0分。保留原回答，待重新分析。</p><button class="primary" data-retry ${retrying?'disabled':''}>${retrying?'正在重新分析（演示）…':'重新分析（演示）'}</button></div>`:`<small>评价范围</small><p>${rows[i].scope}</p><div class="callout"><strong>为什么是 ${score(i)} 分？</strong><p>${rows[i].reason}</p></div><div class="section-label">以下判断均关联候选人的实际回答原文</div>${point('亮点',rows[i].strength)}${point('不足',rows[i].gap)}`}</div><div class="detail-footer tools"><button data-return="all">返回作答修改</button>${inDrawer?'<button data-close="detail-dialog" class="back">关闭详情</button>':''}</div>`}
function render(){const total=Array.from({length:6},(_,i)=>score(i)).some(s=>s===null)?null:weights.reduce((n,w,i)=>n+w*score(i),0)/100;document.getElementById('main').innerHTML=`<div class="prototype-note">报告页原型 · 全部为演示资料与分析，不读取你的面试记录，不调用大模型。可点击维度、评分细则和原文体验。</div><div class="steps"><span>1. 目标</span><span>2. 材料</span><span>3. 核对题目</span><span>4. 作答</span><span>5. 评分前检查</span><strong>6. 报告</strong></div><header class="titlebar"><div><h1>整场面试报告</h1><p>AI 产品经理 · 示例简历 · 本场已确认回答</p></div><div class="tools"><button data-return="all">返回作答修改</button><a href="prompt.md" target="_blank" rel="noopener">查看配套 Prompt ↗</a></div></header>${scenario==='stale'?'<div class="callout warn"><strong>答案已修改，报告待重新评估。</strong><p>以下仍是旧答案快照的分析；点击查看不自动重评。</p><button data-refresh>重新评估整场（演示）</button></div>':''}<section class="panel overview"><div><small>${total===null?'报告待核查':'加权总分'}</small><div class="score" style="margin-top:10px">${total===null?'—':total.toFixed(2)}<small> /100</small></div><p><span class="tag">六个维度 · 整场评估</span></p></div><div class="summary"><h3>本场表现概览</h3><p>需求拆解与业务落地经历较清楚；专业方案的机制、取舍和效果验证仍需补充。</p><p class="muted">${scenario==='complete'?'六个维度均有已确认回答。':scenario==='failed'?'一项分析未完成，总分暂不计算；未覆盖维度与分析失败分别标记。':'学习成长潜力、价值观与文化契合未补答，按默认60分计入，非实际评估。'}</p><small>分数与分析均为原型样例，不代表你的真实面试表现。</small></div></section><div class="row" style="margin:24px 0 14px"><h2 style="margin:0">评分维度</h2><small>点击查看亮点、不足与依据</small></div>${variant==='A'?`<div class="score-grid"><nav class="dimension-nav" aria-label="六个评分维度">${names.map((_,i)=>dimension(i)).join('')}</nav><section class="panel detail" id="detail-panel">${detail(selected)}</section></div>`:variant==='B'?names.map((_,i)=>`<section class="accordion-row ${i===selected?'expanded':''}">${dimension(i)}${i===selected?`<div class="panel detail">${detail(i)}</div>`:''}</section>`).join(''):`<section class="panel"><table class="score-table"><thead><tr><th>评分维度</th><th class="weight">权重</th><th>分数</th><th>详情</th></tr></thead><tbody>${names.map((name,i)=>`<tr><td>${name}<br><small>${status(i)==='default'?'默认分 · 非实际评估':status(i)==='failed'?'分析失败':'已有回答依据'}</small></td><td class="weight">${weights[i]}%</td><td class="table-number">${score(i)===null?'—':score(i)}</td><td><button data-dimension="${i}">查看分析</button></td></tr>`).join('')}</tbody></table></section>`}<section class="prototype-controls" aria-label="原型演示状态"><strong>演示状态</strong><select id="scenario" aria-label="切换演示状态">${[['missing','部分维度未覆盖（默认60分）'],['complete','六维均有回答'],['failed','一项分析失败（不记0分）'],['stale','修改过答案，待重新评估']].map(([v,n])=>`<option value="${v}" ${scenario===v?'selected':''}>${n}</option>`).join('')}</select><small>仅影响此原型，不保存到应用。</small></section><p class="state-line">当前：${labels[variant]} · ${names[selected]} · ${tab==='analysis'?'回答分析':'评分细则'} · ${scenario==='stale'?'旧答案快照':'演示报告快照'}。本页没有重答编辑区。</p>`;document.getElementById('variant-label').textContent=variant+' · '+labels[variant];if(document.getElementById('detail-dialog').open)document.getElementById('drawer-content').innerHTML=detail(selected,true)}
function changeVariant(offset){const keys=['A','B','C'];variant=keys[(keys.indexOf(variant)+offset+3)%3];const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState({},'',url);document.getElementById('detail-dialog').close();render()}
function showReturn(index){document.getElementById('answer-dialog').close();document.getElementById('detail-dialog').close();document.getElementById('return-description').textContent=index==='all'?'正式接入后将返回本场作答页，保留当前答案与报告。':'正式接入后将返回第'+(Number(index)+1)+'题作答，定位对应回答。';document.getElementById('return-dialog').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.layout){changeVariant(b.dataset.layout==='next'?1:-1);return}if(b.dataset.close){document.getElementById(b.dataset.close).close();return}if(b.dataset.return){showReturn(b.dataset.return);return}if(b.dataset.answer!==undefined){const i=Number(b.dataset.answer);document.getElementById('answer-content').innerHTML=`<div class="row"><h2>第${i+1}题 · 回答原文</h2><button data-close="answer-dialog" aria-label="关闭原文">关闭</button></div><p>${answers[i].question}</p><p class="muted">本次报告使用的答案快照 · 只读 · 示例内容</p><div class="answer-text">${esc(answers[i].text)}</div><div class="dialog-actions tools"><button class="primary" data-return="${i}">回到这题作答修改</button><button data-close="answer-dialog">返回维度分析</button></div>`;document.getElementById('answer-dialog').showModal();return}if(b.dataset.dimension!==undefined){selected=Number(b.dataset.dimension);tab='analysis';render();if(variant==='C'){document.getElementById('drawer-content').innerHTML=detail(selected,true);document.getElementById('detail-dialog').showModal()}else if(innerWidth<821)document.getElementById('main').querySelector('.detail')?.scrollIntoView({block:'start'});return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.hasAttribute('data-retry')){retrying=true;render();setTimeout(()=>{retrying=false;scenario='missing';render();toast('重新分析完成（仅为演示，未调用模型）')},800);return}if(b.hasAttribute('data-refresh')){scenario='missing';render();toast('已替换为新报告（仅演示，未修改真实报告）')}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){scenario=e.target.value;selected=scenario==='failed'?1:scenario==='missing'?4:0;tab='analysis';render()}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable||document.querySelector('dialog[open]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();changeVariant(e.key==='ArrowRight'?1:-1)}});
function toast(text){document.getElementById('toast').textContent=text;setTimeout(()=>document.getElementById('toast').textContent='',3000)}render();
</script></body></html>
